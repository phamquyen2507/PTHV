<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Phân Tích Hành Vi AI</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f5f7;
            color: #222;
        }
        .container {
            width: min(1000px, 92%);
            margin: 45px auto;
            text-align: center;
        }
        h1 { margin-bottom: 28px; }
        .camera-box {
            width: min(900px, 100%);
            margin: auto;
            background: #111;
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .message {
            color: #ddd;
            padding: 20px;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        button {
            border: 0;
            border-radius: 8px;
            padding: 11px 20px;
            cursor: pointer;
            font-size: 15px;
        }
        #startBtn { background: #222; color: white; }
        #stopBtn { background: #ddd; color: #222; }
        button:disabled { opacity: .5; cursor: not-allowed; }
        #status {
            margin-top: 15px;
            min-height: 24px;
            font-size: 14px;
        }
        .result {
            margin: 25px auto 0;
            max-width: 900px;
            background: white;
            border-radius: 12px;
            padding: 18px;
            text-align: left;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Hệ Thống Phân Tích Hành Vi AI</h1>

    <div class="camera-box">
        <video id="camera" autoplay playsinline muted></video>
        <div id="message" class="message">
            Nhấn <b>Bật camera</b> để cho phép trình duyệt sử dụng webcam.
        </div>
    </div>

    <div class="controls">
        <button id="startBtn">Bật camera</button>
        <button id="stopBtn" disabled>Tắt camera</button>
    </div>

    <div id="status"></div>

    <div class="result">
        <b>Kết quả phân tích AI</b>
        <p id="aiResult">Chưa có dữ liệu phân tích.</p>
    </div>
</div>

<script>
    const video = document.getElementById("camera");
    const message = document.getElementById("message");
    const statusText = document.getElementById("status");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");

    let cameraStream = null;

    async function startCamera() {
        try {
            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: {
                    width: { ideal: 1280 },
                    height: { ideal: 720 },
                    facingMode: "user"
                },
                audio: false
            });

            video.srcObject = cameraStream;
            video.style.display = "block";
            message.style.display = "none";

            startBtn.disabled = true;
            stopBtn.disabled = false;

            statusText.textContent = "Camera đang hoạt động.";
        } catch (error) {
            console.error(error);
            statusText.textContent =
                "Không thể mở camera. Hãy kiểm tra quyền Camera của trình duyệt.";
        }
    }

    function stopCamera() {
        if (cameraStream) {
            cameraStream.getTracks().forEach(track => track.stop());
            cameraStream = null;
        }

        video.srcObject = null;
        video.style.display = "none";
        message.style.display = "block";

        startBtn.disabled = false;
        stopBtn.disabled = true;

        statusText.textContent = "Camera đã tắt.";
    }

    startBtn.addEventListener("click", startCamera);
    stopBtn.addEventListener("click", stopCamera);

    window.addEventListener("beforeunload", stopCamera);
</script>

</body>
</html>
